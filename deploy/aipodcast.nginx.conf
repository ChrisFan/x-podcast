# Included inside the existing alu-designer HTTPS server. All services remain loopback-only.
location = /podcast { return 302 /podcast/; }
location ^~ /podcast/mcp {
    client_max_body_size 128k;
    proxy_pass http://127.0.0.1:3212;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 180s;
    access_log off;
}
location ^~ /podcast/ {
    client_max_body_size 128k;
    proxy_pass http://127.0.0.1:3211;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 180s;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}
